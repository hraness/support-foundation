# From the hraness/.github Dependabot template: one grouped pull request per
# ecosystem each week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  # Bun, not npm: npm updates fail on bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      bun-minor-patch:
        update-types:
          - minor
          - patch
