name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: bun run check
        if: runner.os != 'Windows'
      - name: Rust and cross-runtime interoperability on Windows
        if: runner.os == 'Windows'
        run: bun run typecheck && bun run check:rust-contract && bun run check:rust && bun test tests/rust-interop.test.ts
      - run: git diff --exit-code -- dist bun.lock Cargo.lock rust/src/contract-v1.json
  required:
    name: Required
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECK" = success
        env:
          CHECK: ${{ needs.check.result }}
