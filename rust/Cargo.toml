[package]
name = "hraness-support-foundation"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Optional human support handoffs and shared agent invitation preferences"
publish = false

[dependencies]
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
