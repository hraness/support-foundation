name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs cancel superseded runs; every push to main keeps its own group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Pull requests restore the cache; only main saves it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun run check
        if: runner.os == 'Linux'
      # Linux runs the full gate. macOS only reruns what depends on the host:
      # the Rust/JS interop binary, Rust and JS FIFO/mode state, and Git email
      # discovery.
      - name: Rust and cross-runtime interoperability on macOS
        if: runner.os == 'macOS'
        run: cargo build --locked --example interop && cargo test --locked --test contract state_symlinks_fifo_and_private_modes_fail_closed && bun test tests/rust-interop.test.ts tests/node.test.ts tests/git-email.test.ts
      - name: Rust and cross-runtime interoperability on Windows
        if: runner.os == 'Windows'
        run: bun run typecheck && bun run check:rust-contract && bun run check:rust && bun test tests/rust-interop.test.ts
      - run: git diff --exit-code -- dist bun.lock Cargo.lock rust/src/contract-v1.json
  required:
    name: Required
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECK" = success
        env:
          CHECK: ${{ needs.check.result }}
